name: NKD Pet Recognition
version: "0.2.1"
slug: nkd_pet_recognition
description: Pet recognition from camera snapshots (nakordoni DevAPI), published over MQTT discovery
url: https://github.com/nakordoni/ha-pet-recognition
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
services:
  - mqtt:want
options:
  api_key: ""
  cameras: []
  interval: 30
  threshold: 0.6
  max_failures: 3
  mqtt:
    host: ""
    port: 1883
    username: ""
    password: ""
    discovery_prefix: homeassistant
schema:
  api_key: password
  cameras:
    - name: str
      camera_entity: str?
      snapshot_url: str?
  interval: int(5,3600)
  threshold: float(0,1)
  max_failures: int(1,20)
  mqtt:
    host: str?
    port: port?
    username: str?
    password: password?
    discovery_prefix: str?
